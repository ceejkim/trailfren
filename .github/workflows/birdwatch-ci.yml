name: BirdWatch CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - work

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run camera API smoke tests
        run: npm run smoke:camera
